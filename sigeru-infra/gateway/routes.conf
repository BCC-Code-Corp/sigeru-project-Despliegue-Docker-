# Rutas internas compartidas por los servidores HTTP y HTTPS.
location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location ^~ /Backend/api/usuarios/ {
    proxy_pass http://api-usuarios/;
    include /etc/nginx/conf.d/proxy_params;
}
location ^~ /Backend/api/gestion/ {
    proxy_pass http://api-gestion/;
    include /etc/nginx/conf.d/proxy_params;
}
location ^~ /Backend/api/recoleccion/ {
    proxy_pass http://api-recoleccion/;
    include /etc/nginx/conf.d/proxy_params;
}

location = /backoffice.html {
    include /etc/nginx/conf.d/admin-allowlist.inc;
    proxy_pass http://backoffice/backoffice.html;
    include /etc/nginx/conf.d/proxy_params;
}
location ^~ /backoffice/ {
    include /etc/nginx/conf.d/admin-allowlist.inc;
    proxy_pass http://backoffice/;
    include /etc/nginx/conf.d/proxy_params;
}
location ^~ /Frontend/ {
    proxy_pass http://frontend/;
    include /etc/nginx/conf.d/proxy_params;
}
location ~ ^/(login|registro|panel|validacion|operaciones|confirmaciones|agente-socializador|menu-panel|config|style)(\.html|\.css|\.js)$ {
    proxy_pass http://frontend;
    include /etc/nginx/conf.d/proxy_params;
}
location / {
    proxy_pass http://landing/;
    include /etc/nginx/conf.d/proxy_params;
}
