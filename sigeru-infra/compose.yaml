name: sigeru

services:
  gateway:
    image: nginx:stable-alpine3.24-slim
    restart: unless-stopped
    depends_on:
      - landing
      - frontend
      - backoffice
      - api-usuarios
      - api-gestion
      - api-recoleccion
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/proxy_params:/etc/nginx/conf.d/proxy_params:ro
      - ./gateway/routes.conf:/etc/nginx/conf.d/routes.conf:ro
      - ./gateway/admin-allowlist.conf:/etc/nginx/conf.d/admin-allowlist.conf:ro
    networks:
      - proxy

  landing:
    build:
      context: ../sigeru-landing
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - proxy

  frontend:
    build:
      context: ../sigeru-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - proxy

  backoffice:
    build:
      context: ../sigeru-backoffice
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - proxy

  api-usuarios:
    build:
      context: ../sigeru-api-usuarios
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &api-environment
      SIGERU_DB_HOST: db
      SIGERU_DB_PORT: 3306
      SIGERU_DB_NAME: sigeru_db
      SIGERU_DB_USER: ${MARIADB_USER:?Definí MARIADB_USER en .env}
      SIGERU_DB_PASSWORD: ${MARIADB_PASSWORD:?Definí MARIADB_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
      - data

  api-gestion:
    build:
      context: ../sigeru-api-gestion
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
      - data

  api-recoleccion:
    build:
      context: ../sigeru-api-recoleccion
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
      - data

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: sigeru_db
      MARIADB_USER: ${MARIADB_USER:?Definí MARIADB_USER en .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Definí MARIADB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Definí MARIADB_ROOT_PASSWORD en .env}
    volumes:
      - sigeru_db_data:/var/lib/mysql
      - ./db/001-sigeru.sql:/docker-entrypoint-initdb.d/001-sigeru.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - data

networks:
  proxy:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  sigeru_db_data:
