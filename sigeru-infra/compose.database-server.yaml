name: sigeru-database
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: sigeru_db
      MARIADB_USER: ${MARIADB_USER:?Definí MARIADB_USER en .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Definí MARIADB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Definí MARIADB_ROOT_PASSWORD en .env}
    ports:
      - "${DB_BIND_IP:?Definí IP privada de la interfaz DB}:3306:3306"
    volumes:
      - sigeru_db_data:/var/lib/mysql
      - ./db/001-sigeru.sql:/docker-entrypoint-initdb.d/001-sigeru.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [db-internal]
networks:
  db-internal:
    driver: bridge
    internal: true
volumes:
  sigeru_db_data:
