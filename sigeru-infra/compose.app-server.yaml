name: sigeru-app
services:
  gateway:
    image: nginx:stable-alpine3.24-slim
    restart: unless-stopped
    depends_on: [landing, frontend, backoffice, api-usuarios, api-gestion, api-recoleccion]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./gateway/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/routes.conf:/etc/nginx/conf.d/routes.conf:ro
      - ./gateway/admin-allowlist.conf:/etc/nginx/conf.d/admin-allowlist.conf:ro
      - ./gateway/proxy_params:/etc/nginx/conf.d/proxy_params:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [proxy]
  landing:
    build: {context: ../sigeru-landing, dockerfile: Dockerfile}
    restart: unless-stopped
    networks: [proxy]
  frontend:
    build: {context: ../sigeru-frontend, dockerfile: Dockerfile}
    restart: unless-stopped
    networks: [proxy]
  backoffice:
    build: {context: ../sigeru-backoffice, dockerfile: Dockerfile}
    restart: unless-stopped
    networks: [proxy]
  api-usuarios:
    build: {context: ../sigeru-api-usuarios, dockerfile: Dockerfile}
    restart: unless-stopped
    environment: &api-env
      SIGERU_DB_HOST: ${MARIADB_HOST:?Definí IP privada del servidor DB}
      SIGERU_DB_PORT: 3306
      SIGERU_DB_NAME: sigeru_db
      SIGERU_DB_USER: ${MARIADB_USER:?Definí usuario DB}
      SIGERU_DB_PASSWORD: ${MARIADB_PASSWORD:?Definí contraseña DB}
    networks: [proxy]
  api-gestion:
    build: {context: ../sigeru-api-gestion, dockerfile: Dockerfile}
    restart: unless-stopped
    environment: *api-env
    networks: [proxy]
  api-recoleccion:
    build: {context: ../sigeru-api-recoleccion, dockerfile: Dockerfile}
    restart: unless-stopped
    environment: *api-env
    networks: [proxy]
networks:
  proxy: {driver: bridge}
